[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "music-library"
version = "0.1.0"
description = "Local music library manager: fetch playlists, download audio, recognise tracks, and organise files with ID3 metadata."
authors = [
    { name = "Your Name", email = "you@example.com" },
]
requires-python = ">=3.14"
dependencies = [
    "requests>=2.32",
    "spotipy>=2.24",
    "yt-dlp>=2024.1.1",
    "shazamio>=0.7.0",
    # stdlib audioop was removed in 3.13; pydub (via shazamio) still needs it
    "audioop-lts>=0.2.1; python_version >= '3.13'",
    "mutagen>=1.47",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "sse-starlette>=2.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
ui-legacy = [
    "streamlit>=1.30",
]

[project.scripts]
music-library = "main:main"
music-library-serve = "frontend.server:serve"

[tool.setuptools]
packages = ["app", "frontend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
